<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AI Lead Qualifier</title>
    <link rel="icon" href="/static/target.svg" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/app.js?v=1" defer></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <img src="/static/target.svg" width="24" height="24" alt="" />Lead
        Qualifier
      </div>
      <span class="badge">LOCAL AI</span><a href="/docs">API docs</a>
    </header>
    <main>
      <div class="heading">
        <div>
          <p class="eyebrow">COMMERCIAL INTELLIGENCE</p>
          <h1>Qualification pipeline</h1>
        </div>
        <div class="actions">
          <button id="samples">Load sample leads</button
          ><button id="new" class="primary">New lead</button>
        </div>
      </div>
      <p id="notice" role="status"></p>
      <div id="metrics" class="metrics"></div>
      <div class="layout">
        <section>
          <div class="filters">
            <label
              >Classification<select id="classification">
                <option value="">All leads</option>
                <option value="pending">Pending</option>
                <option value="quente">Hot / quente</option>
                <option value="morno">Warm / morno</option>
                <option value="frio">Cold / frio</option>
              </select></label
            ><label
              >Source<select id="source">
                <option value="">All sources</option>
              </select></label
            >
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Contact / company</th>
                  <th>Score</th>
                  <th>Classification</th>
                  <th>Source</th>
                </tr>
              </thead>
              <tbody id="leads"></tbody>
            </table>
          </div>
        </section>
        <aside id="detail"><p class="empty">Select a lead.</p></aside>
      </div>
    </main>
    <dialog id="create">
      <form id="createForm">
        <div class="heading">
          <h2>New lead</h2>
          <button type="button" id="close" aria-label="Close" title="Close">
            <img src="/static/x.svg" width="18" height="18" alt="" />
          </button>
        </div>
        <div class="form-grid">
          <label
            >Name<input
              name="name"
              minlength="2"
              maxlength="100"
              required /></label
          ><label
            >Company<input
              name="company"
              minlength="2"
              maxlength="150"
              required /></label
          ><label
            >Email<input
              name="email"
              type="email"
              maxlength="200"
              required /></label
          ><label
            >Phone<input
              name="phone"
              minlength="8"
              maxlength="30"
              required /></label
          ><label
            >Role<input
              name="role"
              minlength="2"
              maxlength="100"
              required /></label
          ><label
            >Company size<input
              name="company_size"
              type="number"
              min="1"
              max="1000000"
              required /></label
          ><label
            >Segment<input
              name="segment"
              minlength="2"
              maxlength="100"
              required /></label
          ><label
            >Budget (BRL)<input
              name="budget"
              type="number"
              min="0"
              max="1000000000"
              step="0.01"
              required
          /></label>
        </div>
        <label
          >Interest<input
            name="interest"
            minlength="3"
            maxlength="250"
            required /></label
        ><label
          >Message<textarea
            name="message"
            rows="4"
            minlength="10"
            maxlength="5000"
            required
          ></textarea></label
        ><label
          >Source<input
            name="source"
            minlength="2"
            maxlength="100"
            required /></label
        ><button class="primary">Create lead</button>
        <p class="form-error" role="alert"></p>
      </form>
    </dialog>
  </body>
</html>
